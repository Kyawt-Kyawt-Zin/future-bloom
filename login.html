<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- bootstrap cdn  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- bootstrap icon cdn  -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- external css  -->

    <link rel="stylesheet" href="assets/css/homepage.css" />
    <link
      rel="shortcut icon"
      href="images/FutureBloomLogo.png"
      type="image/x-icon"
    />
    <title>&#127793; FutureBloom</title>
  </head>
  <body>
    <div
      id="bg"
      class="bg-home position-fixed top-0 start-0 w-100 h-100 z-n1"
    ></div>

    <!-- navigation bar  -->

    <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top px-3">
      <div class="container-fluid">
        <a href="#" class="navbar-brand fw-bold">
          <h1 class="fw-bold fs-2 text-shadow m-0">
            <span style="font-size: 32px">&#127793;</span>
            FutureBloom
          </h1>
        </a>

        <button
          type="button"
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
          <div class="d-flex flex-column flex-lg-row gap-2 ms-auto">
            <a href="index.html" class="btn btn-success rounded-3 px-3"
              >Back To Home</a
            >
          </div>
        </div>
      </div>
    </nav>

    <!-- login form  -->
    <main class="container py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5 bg-light rounded-4 shadow p-4">
          <h2 class="text-center">Login</h2>
          <p class="text-center">
            Don't have an account?
            <a href="signup-page/index.html">Sign Up</a>
          </p>
          <!-- error message box  -->
          <form id="loginForm" onsubmit="login(event)">
            <!-- username/email -->
            <div class="mb-3 text-center">
              <input
                type="text"
                id="loginInput"
                class="form-control rounded-3"
                placeholder="Enter username or email"
              />
            </div>

            <!-- password -->
            <div class="mb-3">
              <input
                type="password"
                id="loginPassword"
                class="form-control rounded-3"
                placeholder="Enter password"
              />
            </div>

            <!-- button -->
            <div class="text-center mt-4">
              <button type="submit" class="btn btn-success rounded-3 px-5 py-2">
                Login
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <!-- footer section -->
    <footer class="text-center border-top p-3 mt-5">
      <p class="mt-3">
        Copyright &copy; <span id="year"></span> FutureBloom. All rights
        reserved.
      </p>
    </footer>

    <!-- js connect  -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/all.min.js"
      integrity="sha512-6sSYJqDreZRZGkJ3b+YfdhB3MzmuP9R7X1QZ6g5aIXhRvR1Y/N/P47jmnkENm7YL3oqsmI6AK+V6AD99uWDnIw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <script src="assets/js/homepage.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
