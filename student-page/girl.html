<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- bootstrap cdn  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- bootstrap icon cdn  -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- external css  -->

    <link rel="stylesheet" href="../assets/css/homepage.css" />
    <link
      rel="shortcut icon"
      href="../images/FutureBloomLogo.png"
      type="image/x-icon"
    />
    <title>&#127793; FutureBloom</title>
  </head>
  <body>
    <!-- background image  -->
    <div
      id="bg-student-girl"
      class="bg-student-girl position-fixed top-0 start-0 w-100 h-100 z-n1"
    ></div>

    <!-- navbar  -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top px-3">
      <div class="container-fluid px-0">
        <a href="#" class="navbar-brand fw-bold">
          <h1 class="fw-bold fs-2 text-shadow m-0">
            <span style="font-size: 32px">&#127793;</span>
            FutureBloom
          </h1>
        </a>

        <div class="theme-controls d-flex flex-column flex-sm-row gap-2 ms-auto">
          <select id="backgroundSelect" class="form-select form-select-sm">
            <option value="bg-student-girl">Pink Flower</option>
            <option value="bg-teacher">Green</option>
            <option value="bg-student-boy">Sky Blue</option>
            <option value="bg-home">Rainbow</option>
            <option value="bg-parent">Blue</option>
          </select>

          <div class="form-check form-switch d-flex align-items-center gap-2">
            <input
              class="form-check-input"
              type="checkbox"
              id="darkModeSwitch"
            />
            <label class="form-check-label" for="darkModeSwitch">Dark</label>
          </div>
        </div>

        <div class="d-flex flex-column flex-sm-row gap-2 ms-3">
          <div class="dropdown">
            <button
              class="btn btn-outline-success rounded-3"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
              aria-label="Student settings"
            >
              <i class="bi bi-gear-fill"></i>
            </button>

            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <button
                  class="dropdown-item"
                  type="button"
                  data-bs-toggle="modal"
                  data-bs-target="#studentProfileModal"
                >
                  Profile
                </button>
              </li>
              <li>
                <button
                  class="dropdown-item"
                  type="button"
                  data-bs-toggle="modal"
                  data-bs-target="#changePasswordModal"
                >
                  Change Password
                </button>
              </li>
            </ul>
          </div>

          <a href="../index.html" class="btn btn-warning rounded-3 px-3">
            Home
          </a>

          <button id="logoutBtn" class="btn btn-success rounded-3 px-3">
            Log Out
          </button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div
        id="welcomeMessage"
        class="alert alert-success rounded-4 shadow p-4 mt-4"
      ></div>

      <div id="studentAlert"></div>

      <section class="card shadow rounded-4 p-4 mt-4">
        <h3 class="mb-3">My Schedules</h3>
        <div id="studentScheduleList"></div>
      </section>

      <section class="card shadow rounded-4 p-4 mt-4">
        <h3 class="mb-3">My Assignments</h3>
        <div id="studentAssignmentList"></div>
      </section>

      <section
        id="submitAssignmentSection"
        class="card shadow rounded-4 p-4 mt-4"
      >
        <h3 class="mb-3">Submit Assignment</h3>

        <div class="mb-3">
          <label for="pendingAssignmentSelect" class="form-label">
            Choose Pending Assignment
          </label>
          <select id="pendingAssignmentSelect" class="form-select"></select>
        </div>

        <div class="mb-3">
          <label for="assignmentFile" class="form-label">
            Upload Assignment File
          </label>
          <input type="file" id="assignmentFile" class="form-control" />
        </div>

        <button
          id="submitAssignmentDemoBtn"
          class="btn btn-success"
          type="button"
        >
          Submit Assignment
        </button>

        <div id="submitAssignmentMessage" class="mt-3"></div>
      </section>

      <section class="card shadow rounded-4 p-4 mt-4">
        <h3 class="mb-3">My Report Cards</h3>
        <div id="studentReportList"></div>
      </section>
    </main>

    <div
      class="modal fade"
      id="studentProfileModal"
      tabindex="-1"
      aria-labelledby="studentProfileModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content rounded-4">
          <div class="modal-header">
            <h5 class="modal-title" id="studentProfileModalLabel">
              Student Profile
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body" id="studentProfileDetails"></div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="changePasswordModal"
      tabindex="-1"
      aria-labelledby="changePasswordModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content rounded-4">
          <div class="modal-header">
            <h5 class="modal-title" id="changePasswordModalLabel">
              Change Password
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <form id="changePasswordForm">
            <div class="modal-body">
              <div id="changePasswordMessage"></div>

              <div class="mb-3">
                <label for="currentPassword" class="form-label">
                  Current Password
                </label>
                <div class="input-group">
                  <input
                    type="password"
                    id="currentPassword"
                    class="form-control"
                  />
                  <button
                    class="btn btn-outline-success password-toggle-btn"
                    type="button"
                    data-password-target="currentPassword"
                    data-icon-target="currentPasswordIcon"
                  >
                    <i class="bi bi-eye-slash" id="currentPasswordIcon"></i>
                  </button>
                </div>
              </div>

              <div class="mb-3">
                <label for="newPassword" class="form-label">
                  New Password
                </label>
                <div class="input-group">
                  <input
                    type="password"
                    id="newPassword"
                    class="form-control"
                  />
                  <button
                    class="btn btn-outline-success password-toggle-btn"
                    type="button"
                    data-password-target="newPassword"
                    data-icon-target="newPasswordIcon"
                  >
                    <i class="bi bi-eye-slash" id="newPasswordIcon"></i>
                  </button>
                </div>
              </div>

              <div class="mb-3">
                <label for="confirmNewPassword" class="form-label">
                  Confirm Password
                </label>
                <div class="input-group">
                  <input
                    type="password"
                    id="confirmNewPassword"
                    class="form-control"
                  />
                  <button
                    class="btn btn-outline-success password-toggle-btn"
                    type="button"
                    data-password-target="confirmNewPassword"
                    data-icon-target="confirmNewPasswordIcon"
                  >
                    <i class="bi bi-eye-slash" id="confirmNewPasswordIcon"></i>
                  </button>
                </div>
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-outline-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-success">
                Save Password
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- footer section -->
    <footer class="text-center border-top p-3 mt-5">
      <p class="mt-3">
        Copyright &copy; <span id="year"></span> FutureBloom. All rights
        reserved.
      </p>
    </footer>

    <!-- js connect  -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/all.min.js"
      integrity="sha512-6sSYJqDreZRZGkJ3b+YfdhB3MzmuP9R7X1QZ6g5aIXhRvR1Y/N/P47jmnkENm7YL3oqsmI6AK+V6AD99uWDnIw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../assets/js/homepage.js"></script>
    <script src="../assets/js/student.js"></script>
  </body>
</html>
