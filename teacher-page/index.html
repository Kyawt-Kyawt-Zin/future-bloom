<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- bootstrap cdn  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- bootstrap icon cdn  -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- external css  -->

    <link rel="stylesheet" href="../assets/css/homepage.css" />
    <link
      rel="shortcut icon"
      href="../images/FutureBloomLogo.png"
      type="image/x-icon"
    />
    <title>&#127793; FutureBloom</title>
  </head>
  <body>
    <!-- background image  -->
    <div
      id="bg-teacher"
      class="bg-teacher position-fixed top-0 start-0 w-100 h-100 z-n1"
    ></div>

    <!-- navbar  -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top px-3">
      <div class="container-fluid px-0">
        <!-- logo -->
        <a href="#" class="navbar-brand fw-bold">
          <h1 class="fw-bold fs-2 text-shadow m-0">
            <span style="font-size: 32px">&#127793;</span>
            FutureBloom
          </h1>
        </a>

        <!-- toggler -->
        <button
          type="button"
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- collapsible menu -->
        <div class="collapse navbar-collapse" id="navMenu">
          <div
            class="theme-controls d-flex flex-column flex-lg-row gap-2 ms-lg-auto me-lg-3 my-3 my-lg-0"
          >
            <select id="backgroundSelect" class="form-select form-select-sm">
              <option value="bg-teacher">Green</option>
              <option value="bg-student-boy">Sky Blue</option>
              <option value="bg-student-girl">Pink Flower</option>
              <option value="bg-home">Rainbow</option>
              <option value="bg-parent">Blue</option>
            </select>

            <div class="form-check form-switch d-flex align-items-center gap-2">
              <input
                class="form-check-input"
                type="checkbox"
                id="darkModeSwitch"
              />
              <label class="form-check-label" for="darkModeSwitch">
                Dark
              </label>
            </div>
          </div>

          <div class="d-flex flex-column flex-lg-row gap-2">
            <a
              href="../student-page/child-profile.html"
              class="btn btn-warning rounded-3 px-3"
            >
              Add Students
            </a>

            <button id="logoutBtn" class="btn btn-success rounded-3 px-3">
              Log Out
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <!-- welcome  -->
      <div
        id="welcomeMessage"
        class="alert alert-success rounded-4 d-none shadow p-4 mt-4"
      ></div>

      <!-- create a table of students  -->
      <section class="card shadow rounded-4 p-4 mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="mb-0">My Students</h3>
        </div>

        <div class="table-responsive">
          <table class="table table-bordered align-middle">
            <thead class="table-success">
              <tr>
                <th>Student Name</th>
                <th>Student ID</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="studentTableBody"></tbody>

            <tfoot>
              <tr>
                <td colspan="3">
                  <button id="addStudentBtn" class="btn btn-success w-100">
                    Add Student
                  </button>
                </td>
              </tr>
            </tfoot>
          </table>
        </div>

        <div
          id="studentPagination"
          class="d-flex flex-wrap gap-2 justify-content-center mt-3"
        ></div>
      </section>
    </main>

    <!-- footer section -->
    <footer class="text-center border-top p-3 mt-5">
      <p class="mt-3">
        Copyright &copy; <span id="year"></span> FutureBloom. All rights
        reserved.
      </p>
    </footer>

    <!-- js connect  -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/all.min.js"
      integrity="sha512-6sSYJqDreZRZGkJ3b+YfdhB3MzmuP9R7X1QZ6g5aIXhRvR1Y/N/P47jmnkENm7YL3oqsmI6AK+V6AD99uWDnIw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../assets/js/homepage.js"></script>
    <script src="../assets/js/teacher.js"></script>
  </body>
</html>
