<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- bootstrap cdn  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- bootstrap icon cdn  -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- external css  -->

    <link rel="stylesheet" href="../assets/css/homepage.css" />
    <link
      rel="shortcut icon"
      href="../images/FutureBloomLogo.png"
      type="image/x-icon"
    />
    <title>&#127793; FutureBloom</title>
  </head>
  <body>
    <!-- background image  -->
    <div
      id="bg-teacher"
      class="bg-teacher position-fixed top-0 start-0 w-100 h-100 z-n1"
    ></div>

    <!-- navbar  -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top px-3">
      <div class="container-fluid px-0">
        <!-- logo -->
        <a href="#" class="navbar-brand fw-bold">
          <h1 class="fw-bold fs-2 text-shadow m-0">
            <span style="font-size: 32px">&#127793;</span>
            FutureBloom
          </h1>
        </a>

        <!-- toggler -->
        <button
          type="button"
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- collapsible menu -->
        <div class="collapse navbar-collapse" id="navMenu">
          <div
            class="theme-controls d-flex flex-column flex-lg-row gap-2 ms-lg-auto me-lg-3 my-3 my-lg-0"
          >
            <select id="backgroundSelect" class="form-select form-select-sm">
              <option value="bg-teacher">Green</option>
              <option value="bg-student-boy">Sky Blue</option>
              <option value="bg-student-girl">Pink Flower</option>
              <option value="bg-home">Rainbow</option>
              <option value="bg-parent">Blue</option>
            </select>

            <div class="form-check form-switch d-flex align-items-center gap-2">
              <input
                class="form-check-input"
                type="checkbox"
                id="darkModeSwitch"
              />
              <label class="form-check-label" for="darkModeSwitch">
                Dark
              </label>
            </div>
          </div>

          <div class="d-flex flex-column flex-lg-row gap-2">
            <div class="dropdown">
              <button
                class="btn btn-outline-success rounded-3 px-3"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
                aria-label="Teacher settings"
              >
                <i class="bi bi-gear-fill"></i>
              </button>

              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <button
                    class="dropdown-item"
                    type="button"
                    data-bs-toggle="modal"
                    data-bs-target="#teacherChangePasswordModal"
                  >
                    Change Password
                  </button>
                </li>
              </ul>
            </div>

            <button
              id="openAddStudentBtn"
              class="btn btn-warning rounded-3 px-3"
              type="button"
              data-bs-toggle="modal"
              data-bs-target="#addStudentModal"
            >
              Add Students
            </button>

            <button id="logoutBtn" class="btn btn-success rounded-3 px-3">
              Log Out
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <!-- welcome  -->
      <div
        id="welcomeMessage"
        class="alert alert-success rounded-4 d-none shadow p-4 mt-4"
      ></div>

      <div id="teacherAlert"></div>

      <!-- create a table of students  -->
      <section class="card shadow rounded-4 p-4 mt-4">
        <h3 class="mb-3">My Students</h3>

        <input
          type="text"
          id="studentSearchInput"
          class="form-control mb-3"
          placeholder="Search by student name or ID"
        />

        <div class="table-responsive">
          <table class="table table-bordered align-middle">
            <thead class="table-success">
              <tr>
                <th>Student Name</th>
                <th>Student ID</th>
                <th>Grade</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="studentTableBody"></tbody>
          </table>
        </div>

        <p id="studentCount" class="text-muted fw-semibold mb-0"></p>

        <div
          id="studentPagination"
          class="d-flex flex-wrap gap-2 justify-content-center mt-3"
        ></div>
      </section>
    </main>

    <div
      class="modal fade"
      id="teacherChangePasswordModal"
      tabindex="-1"
      aria-labelledby="teacherChangePasswordModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content rounded-4">
          <div class="modal-header">
            <h5 class="modal-title" id="teacherChangePasswordModalLabel">
              Change Password
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <form id="teacherChangePasswordForm">
            <div class="modal-body">
              <div id="teacherPasswordMessage"></div>

              <div class="mb-3">
                <label for="teacherCurrentPassword" class="form-label">
                  Current Password
                </label>
                <div class="input-group">
                  <input
                    type="password"
                    id="teacherCurrentPassword"
                    class="form-control"
                  />
                  <button
                    class="btn btn-outline-success teacher-password-toggle-btn"
                    type="button"
                    data-password-target="teacherCurrentPassword"
                    data-icon-target="teacherCurrentPasswordIcon"
                  >
                    <i
                      class="bi bi-eye-slash"
                      id="teacherCurrentPasswordIcon"
                    ></i>
                  </button>
                </div>
              </div>

              <div class="mb-3">
                <label for="teacherNewPassword" class="form-label">
                  New Password
                </label>
                <div class="input-group">
                  <input
                    type="password"
                    id="teacherNewPassword"
                    class="form-control"
                  />
                  <button
                    class="btn btn-outline-success teacher-password-toggle-btn"
                    type="button"
                    data-password-target="teacherNewPassword"
                    data-icon-target="teacherNewPasswordIcon"
                  >
                    <i class="bi bi-eye-slash" id="teacherNewPasswordIcon"></i>
                  </button>
                </div>
              </div>

              <div class="mb-3">
                <label for="teacherConfirmNewPassword" class="form-label">
                  Confirm Password
                </label>
                <div class="input-group">
                  <input
                    type="password"
                    id="teacherConfirmNewPassword"
                    class="form-control"
                  />
                  <button
                    class="btn btn-outline-success teacher-password-toggle-btn"
                    type="button"
                    data-password-target="teacherConfirmNewPassword"
                    data-icon-target="teacherConfirmNewPasswordIcon"
                  >
                    <i
                      class="bi bi-eye-slash"
                      id="teacherConfirmNewPasswordIcon"
                    ></i>
                  </button>
                </div>
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-outline-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-success">
                Save Password
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="addStudentModal"
      tabindex="-1"
      aria-labelledby="addStudentModalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4">
          <div class="modal-header">
            <h5 class="modal-title" id="addStudentModalTitle">Add Student</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <ul class="nav nav-tabs mb-3" id="addStudentTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link active"
                  id="existingStudentTab"
                  data-bs-toggle="tab"
                  data-bs-target="#existingStudentPane"
                  type="button"
                  role="tab"
                >
                  Existing Student
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link"
                  id="newStudentTab"
                  data-bs-toggle="tab"
                  data-bs-target="#newStudentPane"
                  type="button"
                  role="tab"
                >
                  New Student
                </button>
              </li>
            </ul>

            <div class="tab-content">
              <div
                class="tab-pane fade show active"
                id="existingStudentPane"
                role="tabpanel"
              >
                <label for="availableStudentSelect" class="form-label">
                  Existing students not connected to you
                </label>
                <select
                  id="availableStudentSelect"
                  class="form-select"
                ></select>
              </div>

              <div class="tab-pane fade" id="newStudentPane" role="tabpanel">
                <div class="mb-3">
                  <label for="newStudentName" class="form-label">
                    Student Name
                  </label>
                  <input
                    type="text"
                    id="newStudentName"
                    class="form-control"
                    placeholder="Example: Aye Aye"
                  />
                </div>

                <div class="mb-3">
                  <label for="newStudentEmail" class="form-label">
                    Student Email
                  </label>
                  <input
                    type="email"
                    id="newStudentEmail"
                    class="form-control"
                    placeholder="Example: student@example.com"
                  />
                </div>

                <div class="mb-3">
                  <label for="newStudentParentEmail" class="form-label">
                    Parent Email
                  </label>
                  <input
                    type="email"
                    id="newStudentParentEmail"
                    class="form-control"
                    placeholder="Example: parent@example.com"
                  />
                </div>

                <div class="mb-3">
                  <label for="newStudentGender" class="form-label">
                    Gender
                  </label>
                  <select id="newStudentGender" class="form-select">
                    <option value="">Choose gender</option>
                    <option value="boy">Boy</option>
                    <option value="girl">Girl</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="newStudentGrade" class="form-label">
                    Grade
                  </label>
                  <select id="newStudentGrade" class="form-select">
                    <option value="">Choose grade</option>
                    <option value="Grade 1">Grade 1</option>
                    <option value="Grade 2">Grade 2</option>
                    <option value="Grade 3">Grade 3</option>
                    <option value="Grade 4">Grade 4</option>
                    <option value="Grade 5">Grade 5</option>
                    <option value="Grade 6">Grade 6</option>
                    <option value="Grade 7">Grade 7</option>
                    <option value="Grade 8">Grade 8</option>
                    <option value="Grade 9">Grade 9</option>
                    <option value="Grade 10">Grade 10</option>
                    <option value="Grade 11">Grade 11</option>
                    <option value="Grade 12">Grade 12</option>
                  </select>
                </div>

                <div class="alert alert-info rounded-3 mb-0">
                  Default password for new students is
                  <strong>12345678</strong>.
                </div>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              id="confirmAddExistingStudentBtn"
              type="button"
              class="btn btn-success"
            >
              Add Existing Student
            </button>
            <button
              id="confirmCreateStudentBtn"
              type="button"
              class="btn btn-success d-none"
            >
              Create Student
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="deleteStudentModal"
      tabindex="-1"
      aria-labelledby="deleteStudentModalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4">
          <div class="modal-header">
            <h5 class="modal-title" id="deleteStudentModalTitle">
              Confirm Remove Student
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <p id="deleteStudentMessage" class="mb-0"></p>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              id="confirmDeleteStudentBtn"
              type="button"
              class="btn btn-danger"
            >
              Remove Student
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- footer section -->
    <footer class="fb-footer text-center border-top p-3 mt-5">
      <p class="mt-3">
        Copyright &copy; <span id="year"></span> FutureBloom. All rights
        reserved.
      </p>
    </footer>

    <!-- js connect  -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/all.min.js"
      integrity="sha512-6sSYJqDreZRZGkJ3b+YfdhB3MzmuP9R7X1QZ6g5aIXhRvR1Y/N/P47jmnkENm7YL3oqsmI6AK+V6AD99uWDnIw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../assets/js/homepage.js"></script>
    <script src="../assets/js/teacher.js"></script>
  </body>
</html>
