<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../assets/css/homepage.css" />
    <link
      rel="shortcut icon"
      href="../images/FutureBloomLogo.png"
      type="image/x-icon"
    />
    <title>FutureBloom | Student Access</title>
  </head>
  <body>
    <div
      id="bg-teacher"
      class="bg-teacher position-fixed top-0 start-0 w-100 h-100 z-n1"
    ></div>

    <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top px-3">
      <div class="container-fluid px-0">
        <a href="index.html" class="navbar-brand fw-bold">
          <h1 class="fw-bold fs-2 text-shadow m-0">
            <span style="font-size: 32px">&#127793;</span>
            FutureBloom
          </h1>
        </a>

        <div class="theme-controls d-flex flex-column flex-sm-row gap-2 ms-auto me-3">
          <select id="backgroundSelect" class="form-select form-select-sm">
            <option value="bg-teacher">Green</option>
            <option value="bg-student-boy">Sky Blue</option>
            <option value="bg-student-girl">Pink Flower</option>
            <option value="bg-home">Rainbow</option>
            <option value="bg-parent">Blue</option>
          </select>

          <div class="form-check form-switch d-flex align-items-center gap-2">
            <input
              class="form-check-input"
              type="checkbox"
              id="darkModeSwitch"
            />
            <label class="form-check-label" for="darkModeSwitch">Dark</label>
          </div>
        </div>

        <button id="backToTeacherBtn" class="btn btn-success rounded-3 px-3">
          Back
        </button>

        <button id="logoutBtn" class="btn btn-warning rounded-3 px-3 ms-2">
          Log Out
        </button>
      </div>
    </nav>

    <main class="container py-4">
      <div id="studentInfo" class="alert alert-success rounded-4 shadow p-4"></div>

      <div class="row g-4">
        <div class="col-12 col-lg-6">
          <section class="card shadow rounded-4 p-4 h-100">
            <button
              class="btn btn-success w-100"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#scheduleCollapse"
            >
              Add Schedule
            </button>

            <div class="collapse mt-3" id="scheduleCollapse">
              <form id="scheduleForm">
                <div class="mb-3">
                  <label for="scheduleSubject" class="form-label">Subject</label>
                  <input
                    type="text"
                    id="scheduleSubject"
                    class="form-control"
                    placeholder="Example: Mathematics"
                  />
                </div>

                <div class="mb-3">
                  <label for="scheduleDay" class="form-label">Day</label>
                  <select id="scheduleDay" class="form-select">
                    <option value="">Choose day</option>
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="scheduleStartTime" class="form-label">
                    Start Time
                  </label>
                  <input
                    type="time"
                    id="scheduleStartTime"
                    class="form-control"
                  />
                </div>

                <div class="mb-3">
                  <label for="scheduleEndTime" class="form-label">
                    End Time
                  </label>
                  <input type="time" id="scheduleEndTime" class="form-control" />
                </div>

                <button type="submit" class="btn btn-success w-100">
                  Save Schedule
                </button>
              </form>

              <div id="scheduleMessage" class="mt-3"></div>
            </div>
          </section>
        </div>

        <div class="col-12 col-lg-6">
          <section class="card shadow rounded-4 p-4 h-100">
            <button
              class="btn btn-success w-100"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#assignmentCollapse"
            >
              Add Assignment
            </button>

            <div class="collapse mt-3" id="assignmentCollapse">
              <form id="assignmentForm">
                <div class="mb-3">
                  <label for="assignmentTitle" class="form-label">Title</label>
                  <input
                    type="text"
                    id="assignmentTitle"
                    class="form-control"
                    placeholder="Example: Geometry worksheet"
                  />
                </div>

                <div class="mb-3">
                  <label for="assignmentSubject" class="form-label">Subject</label>
                  <input
                    type="text"
                    id="assignmentSubject"
                    class="form-control"
                    placeholder="Example: Mathematics"
                  />
                </div>

                <div class="mb-3">
                  <label for="assignmentDeadline" class="form-label">
                    Deadline
                  </label>
                  <input
                    type="date"
                    id="assignmentDeadline"
                    class="form-control"
                  />
                </div>

                <div class="mb-3">
                  <label for="assignmentStatus" class="form-label">Status</label>
                  <select id="assignmentStatus" class="form-select">
                    <option value="pending">Pending</option>
                    <option value="complete">Complete</option>
                  </select>
                </div>

                <button type="submit" class="btn btn-success w-100">
                  Save Assignment
                </button>
              </form>

              <div id="assignmentMessage" class="mt-3"></div>
            </div>
          </section>
        </div>
      </div>

      <section class="card shadow rounded-4 p-4 mt-4">
        <button
          class="btn btn-success w-100"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#reportCollapse"
        >
          Add Report Card
        </button>

        <div class="collapse mt-3" id="reportCollapse">
          <form id="reportForm">
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label for="reportSubject" class="form-label">Subject</label>
                <input
                  type="text"
                  id="reportSubject"
                  class="form-control"
                  placeholder="Example: Mathematics"
                />
              </div>

              <div class="col-12 col-md-6">
                <label for="reportMonth" class="form-label">Report Month</label>
                <input type="month" id="reportMonth" class="form-control" />
              </div>

              <div class="col-12 col-md-6">
                <label for="reportMarks" class="form-label">Marks</label>
                <input
                  type="number"
                  id="reportMarks"
                  class="form-control"
                  min="0"
                  max="100"
                  placeholder="Example: 85"
                />
                <div class="form-text">
                  Enter marks from 0 to 100.
                </div>
              </div>

              <div class="col-12 col-md-6">
                <label for="reportGrade" class="form-label">Grade</label>
                <input
                  type="text"
                  id="reportGrade"
                  class="form-control"
                  placeholder="Grade will appear automatically"
                  readonly
                />
                <div class="form-text">
                  A+: 90-100, A: 80-89, B: 70-79, C: 60-69, D: 50-59, F: below 50.
                </div>
              </div>

              <div class="col-12">
                <label for="reportComment" class="form-label">
                  Teacher Comment
                </label>
                <textarea
                  id="reportComment"
                  class="form-control"
                  rows="4"
                  placeholder="Write a short progress note"
                ></textarea>
              </div>

              <div class="col-12">
                <button type="submit" class="btn btn-success w-100">
                  Save Report Card
                </button>
              </div>
            </div>
          </form>

          <div id="reportMessage" class="mt-3"></div>
        </div>
      </section>

      <section class="card shadow rounded-4 p-4 mt-4">
        <h3 class="mb-3">Existing Records</h3>

        <h4 class="fs-5">Schedules</h4>
        <div id="scheduleList" class="mb-4"></div>

        <h4 class="fs-5">Assignments</h4>
        <div id="assignmentList" class="mb-4"></div>

        <h4 class="fs-5">Report Cards</h4>
        <div id="reportList"></div>
      </section>
    </main>

    <footer class="text-center border-top p-3 mt-5">
      <p class="mt-3">
        Copyright &copy; <span id="year"></span> FutureBloom. All rights
        reserved.
      </p>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../assets/js/homepage.js"></script>
    <script src="../assets/js/access.js"></script>
  </body>
</html>
