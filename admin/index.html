<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../assets/css/homepage.css" />
    <link
      rel="shortcut icon"
      href="../images/FutureBloomLogo.png"
      type="image/x-icon"
    />
    <title>FutureBloom | Admin Dashboard</title>
  </head>
  <body class="admin-body">
    <main id="adminLoginView" class="admin-login-view">
      <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
          <div class="col-11 col-md-7 col-lg-5 col-xl-4">
            <form id="adminLoginForm" class="admin-login-card p-4">
              <h1 class="fs-3 text-center mb-4">
                <span style="font-size: 32px">&#127793;</span>
                Admin Panel
              </h1>

              <div id="adminLoginMessage"></div>

              <div class="mb-3">
                <label for="adminLoginInput" class="form-label">
                  Username or Email
                </label>
                <input
                  type="text"
                  id="adminLoginInput"
                  class="form-control"
                  placeholder="Enter admin username or email"
                />
              </div>

              <div class="mb-4">
                <label for="adminLoginPassword" class="form-label">
                  Password
                </label>
                <div class="input-group">
                  <input
                    type="password"
                    id="adminLoginPassword"
                    class="form-control"
                    placeholder="Enter admin password"
                  />
                  <button
                    id="toggleAdminPassword"
                    class="btn btn-success"
                    type="button"
                    aria-label="Show or hide password"
                  >
                    <i class="bi bi-eye-slash" id="adminPasswordIcon"></i>
                  </button>
                </div>
              </div>

              <button type="submit" class="btn btn-success w-100">
                Log In
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <div id="adminDashboardView" class="admin-shell d-none">
      <aside class="admin-sidebar">
        <a href="#" class="admin-brand">
          <span class="admin-brand-icon">&#127793;</span>
          <span>ADMIN</span>
        </a>

        <div class="admin-control-title">Controls</div>

        <div class="list-group admin-menu">
          <button
            class="list-group-item list-group-item-action active admin-tab-btn"
            type="button"
            data-admin-tab="dashboard"
          >
            <i class="bi bi-speedometer2"></i>
            Dashboard
          </button>
          <button
            class="list-group-item list-group-item-action admin-tab-btn"
            type="button"
            data-admin-tab="teachers"
          >
            <i class="bi bi-person-workspace"></i>
            Teachers
          </button>
          <button
            class="list-group-item list-group-item-action admin-tab-btn"
            type="button"
            data-admin-tab="students"
          >
            <i class="bi bi-mortarboard"></i>
            Students
          </button>
          <button
            class="list-group-item list-group-item-action admin-tab-btn"
            type="button"
            data-admin-tab="subjects"
          >
            <i class="bi bi-journal-bookmark"></i>
            Main Subjects
          </button>
          <button
            class="list-group-item list-group-item-action admin-tab-btn"
            type="button"
            data-admin-tab="additionalSubjects"
          >
            <i class="bi bi-plus-square"></i>
            Additional Subjects
          </button>
          <button
            class="list-group-item list-group-item-action admin-tab-btn"
            type="button"
            data-admin-tab="schedules"
          >
            <i class="bi bi-calendar-week"></i>
            Schedules
          </button>
          <button
            class="list-group-item list-group-item-action admin-tab-btn"
            type="button"
            data-admin-tab="assignments"
          >
            <i class="bi bi-clipboard-check"></i>
            Assignments
          </button>
          <button
            class="list-group-item list-group-item-action admin-tab-btn"
            type="button"
            data-admin-tab="reports"
          >
            <i class="bi bi-card-checklist"></i>
            Report Cards
          </button>
        </div>
      </aside>

      <div class="admin-main">
        <nav class="admin-topbar">
          <div>
            <p class="text-muted mb-0">FutureBloom</p>
            <h1 id="adminPageTitle" class="fs-3 mb-0">Dashboard</h1>
          </div>

          <div class="d-flex align-items-center gap-2">
            <button
              id="adminLogoutBtn"
              class="btn btn-outline-success btn-sm rounded-3"
              type="button"
            >
              Log Out
            </button>
            <a href="../index.html" class="btn btn-success btn-sm rounded-3">
              Home
            </a>
          </div>
        </nav>

        <main class="admin-content">
          <div id="adminWelcome" class="alert alert-success rounded-4"></div>

          <section class="admin-panel">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-3">
              <div>
                <p id="adminSectionLabel" class="text-muted mb-1">Overview</p>
                <h2 id="adminSectionTitle" class="fs-4 mb-0">Dashboard</h2>
              </div>
              <div id="adminTotalBadge"></div>
            </div>

            <div id="adminQuickStats" class="row g-3 mb-4"></div>
            <div id="adminDataView"></div>
          </section>
        </main>
      </div>
    </div>

    <footer id="adminFooter" class="admin-footer text-center border-top p-3 d-none">
      Copyright &copy; <span id="year"></span> FutureBloom. All rights
      reserved.
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../assets/js/homepage.js"></script>
    <script src="../assets/js/admin.js"></script>
  </body>
</html>
