<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- bootstrap cdn  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- bootstrap icon cdn  -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- external css  -->

    <link rel="stylesheet" href="../assets/css/homepage.css" />
    <link
      rel="shortcut icon"
      href="../images/FutureBloomLogo.png"
      type="image/x-icon"
    />
    <title>&#127793; FutureBloom||Sign Up/Log In</title>
  </head>

  <body>
    <div
      id="bg"
      class="bg-home position-fixed top-0 start-0 w-100 h-100 z-n1"
    ></div>

    <!-- navbar  -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-transparent sticky-top px-3"
    >
      <div class="container-fluid">
        <a href="#" class="navbar-brand fw-bold">
          <h1 class="fw-bold fs-2 text-shadow m-0">
            <span style="font-size: 32px">&#127793;</span>
            FutureBloom
          </h1>
        </a>

        <button
          type="button"
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
          <div
            class="d-flex flex-column flex-lg-row gap-2 ms-auto align-items-lg-center"
          >
            <span>Already have an account?</span>
            <a href="../login.html" class="btn btn-warning rounded-3 px-3"
              >Login</a
            >
          </div>
        </div>
      </div>
    </nav>

    <!-- signup form  -->
    <main class="container py-4">
      <h2 class="text-center">Sign Up</h2>

      <div class="row justify-content-center">
        <div
          class="col-12 col-md-10 col-lg-7 col-xl-6 bg-light rounded-4 shadow p-4"
        >
          <!-- error message box  -->
          <div
            id="error"
            class="alert alert-danger alert-dismissible text-start"
          ></div>

          <form id="signUpForm">
            <!-- username  -->
            <div class="mt-3 mb-3">
              <label for="username" class="col-sm-2 col-form-label"
                >Username
              </label>
              <div class="col-sm-10">
                <input
                  type="text"
                  name="username"
                  id="username"
                  class="form-control"
                />
              </div>
            </div>
            <!-- email  -->
            <div class="mb-3">
              <label for="email" class="col-sm-2 col-form-label">Email </label>
              <div class="col-sm-10">
                <input
                  type="email"
                  name="email"
                  id="email"
                  class="form-control"
                />
              </div>
            </div>
            <!-- password  -->
            <div class="mb-3">
              <label for="password" class="col-sm-2 form-label"
                >Password
              </label>
              <div class="col-sm-10">
                <div class="input-group">
                  <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                  />
                  <button
                    class="btn btn-primary"
                    type="button"
                    id="togglePassword"
                  >
                    <i class="bi bi-eye-slash" id="eye-icon"></i>
                  </button>
                </div>
              </div>
            </div>

            <!-- make selection for your Role  -->
            <div class="mb-3">
              <label for="role" class="form-label">Select your role:</label>

              <select
                name="selectRole"
                id="role"
                class="form-select"
                onchange="handleRoleChange()"
              >
                <option value="" selected disabled>--- Select Role ---</option>
                <option value="parent">Parent</option>
                <option value="teacher">Teacher</option>
                <option value="student">Student</option>
              </select>
            </div>

            <div class="mb-3 d-none" id="genderBox">
              <label for="gender" class="form-label">Select Gender</label>

              <select name="gender" id="gender" class="form-select">
                <option value="">Select Gender</option>
                <option value="boy">Boy</option>
                <option value="girl">Girl</option>
              </select>
            </div>

            <div class="text-center py-4">
              <button id="signUp" type="submit" class="btn btn-primary me-auto">
                Sign Up
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <!-- footer section -->
    <footer class="text-center border-top p-3 mt-5">
      <p class="mt-3">
        Copyright &copy; <span id="year"></span> FutureBloom. All rights
        reserved.
      </p>
    </footer>

    <!-- js connect  -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/all.min.js"
      integrity="sha512-6sSYJqDreZRZGkJ3b+YfdhB3MzmuP9R7X1QZ6g5aIXhRvR1Y/N/P47jmnkENm7YL3oqsmI6AK+V6AD99uWDnIw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../assets/js/homepage.js"></script>
    <script src="../assets/js/signup.js"></script>
  </body>
</html>
